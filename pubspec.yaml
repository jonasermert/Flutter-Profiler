name: flutter_profiler
description: Ein leichtgewichtiger Performance-Profiler für Flutter-Apps mit Live-Overlay und JSON-Export.
version: 1.1.0
homepage: https://github.com/jonasermert/Flutter-Profiler
repository: https://github.com/jonasermert/Flutter-Profiler

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
