name: flutter_profiler
description: Ein leichtgewichtiger Performance-Profiler für Flutter-Apps mit Live-Overlay und JSON-Export-Funktion.
version: 1.0.0
homepage: https://github.com/jonaseremrt/flutter_profiler # Optional
repository: https://github.com/ermert/flutter_profiler # Optional

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true